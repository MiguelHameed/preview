<body>
  <a class="skip-link" href="#messages">Skip to content</a>

  <div class="desk">
    <div class="app" id="app">
      <!-- window bar -->
      <!-- Window bar, after Safari in its compact state: traffic lights and a URL pill, nothing else.
           No tabs, no back arrows — a fake toolbar under the visitor's real one is what makes these look
           like mockups. aria-hidden because it is scenery; the real address is in the real address bar. -->
      <div class="app-bar" aria-hidden="true">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="url-pill">
          <svg class="url-lock" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 10V8a5 5 0 0 1 10 0v2" /><rect x="5" y="10" width="14" height="10" rx="2.5" />
          </svg>
          miguelhameed.com
        </span>

      <!-- icon rail (desktop) -->
      <nav class="rail" aria-label="Workspace">
        <a class="rail-mark" href="#intro" aria-label="Miguel's logo, back to the top"><img src="images/site/logo.svg" alt="" width="38" height="38" /></a>
        <a class="rail-btn is-active" href="#intro" data-rail="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
          <span>Home</span>
        </a>
        <a class="rail-btn" href="#intro" data-rail="dms">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>

        </a>
        <a class="rail-btn" href="#projects" data-rail="projects">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm2 0h4V5h-4z"/></svg>
          <span>Projects</span>
        </a>
        <button class="rail-btn theme-btn" type="button" data-theme-toggle aria-label="Theme: switch between slate and ember">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
          <span>Theme</span>
        </button>
        <button class="rail-btn side-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Sidebar: hide or show the channel list" data-side-toggle>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h4V6H5zm6 0v12h8V6h-8z"/></svg>
          <span>Sidebar</span>
        </button>

            <strong>Miguel's Workspace</strong>

        </div>

            <a href="mailto:miguelhameed@gmail.com">miguelhameed@gmail.com</a> or download his <a href="cv.pdf">CV</a>.</p></noscript>

           of the link, not inside it: a button cannot live in an anchor. -->
      <div class="float-wrap" id="float-btn">
        <a class="float-btn" id="float-link" href="#">What's the project?</a>
        <button class="float-x" id="float-x" type="button" aria-label="Dismiss">
